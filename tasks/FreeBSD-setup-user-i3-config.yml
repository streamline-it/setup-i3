---
- name: check to see if i3 config directory exists
  tags: displayenv
  register: setup_i3_config_check
  loop:
    "{{ setup_i3_gui_users }}"
  ansible.builtin.stat:
    path: "/home/{{ item['username'] }}/{{ setup_i3_user_config_path }}"
    get_attributes: true

- name: modify the i3 config file if it exists
  tags: displayenv
  loop:
    "{{ setup_i3_gui_users }}"
  loop_control:
    index_var: setup_i3_loop_index
  when: 
    - setup_i3_config_check['results'][setup_i3_loop_index]['stat']['exists'] == true
    - item['username'] is in setup_i3_config_check['results'][setup_i3_loop_index]['stat']['path']
  ansible.builtin.blockinfile:
    path: "/home/{{ item['username'] }}/{{ setup_i3_user_config_path }}"
    block: |
      # RO Mods
      assign [class="terminal"] 2
      bindsym $mod+n workspace 4; exec "thunar"
      bindsym $mod+t workspace 4; exec "mousepad"
      bindsym $mod+b workspace 3; exec "firefox"
      bindsym $mod+o workspace 5; exec "libreoffice"
      # End of RO mods
    state: present

- name: ensure the user super key is set appropriately for that user
  tags: displayenv
  loop:
    "{{ setup_i3_gui_users }}"
  loop_control:
    index_var: setup_i3_loop_index
  when: 
    - setup_i3_config_check['results'][setup_i3_loop_index]['stat']['exists'] == true
    - item['username'] is in setup_i3_config_check['results'][setup_i3_loop_index]['stat']['path']
  ansible.builtin.lineinfile:
    path: "/home/{{ item['username'] }}/{{ setup_i3_user_config_path }}"
    regex: "set $mod Mod1"
    line: "set $mod {{ item['super_key'] }}"
