---
# tasks file for setup-i3
- name: import OS specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: import tasks to check asserts
  ansible.builtin.include_tasks: asserts.yml

- name: import tasks to install packages
  ansible.builtin.include_tasks: FreeBSD-install-pkgs.yml

- name: import tasks to configure rc.conf
  ansible.builtin.include_tasks: FreeBSD-configure-rc-conf.yml

- name: call task to ensure pixbuf cache and mime database is updated
  ansible.builtin.include_tasks: FreeBSD-setup-pixbuf-mime-db.yml

- name: call task to make sure gui users have gecos names setup
  ansible.builtin.include_tasks: FreeBSD-setup-gui-users.yml

- name: import tasks to configure service(s)
  ansible.builtin.include_tasks: FreeBSD-configure-svcs.yml

- name: import tasks to add wallpaper files to host
  ansible.builtin.include_tasks: FreeBSD-import-wallpaper-files.yml

- name: import tasks to setup i3 config file
  ansible.builtin.include_tasks: FreeBSD-setup-user-i3-config.yml

- name: import tasks to deploy my documentation
  ansible.builtin.include_tasks: FreeBSD-setup-doc.yml
